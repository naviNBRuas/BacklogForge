{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  {{ form.hidden_tag() }}
  <div class="field">{{ form.email.label }} {{ form.email() }}</div>
  <div class="field">{{ form.password.label }} {{ form.password() }}</div>
  <button type="submit">Log in</button>
</form>
<p>No account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
{% endblock %}
