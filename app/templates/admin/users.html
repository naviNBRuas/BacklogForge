{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin.dashboard') }}">&larr; Admin Dashboard</a></p>
<h1>Users</h1>
<table>
  <tr><th>Email</th><th>Role</th><th>Created</th></tr>
  {% for user in users %}
  <tr><td>{{ user.email }}</td><td>{{ user.role }}</td><td>{{ user.created_at.strftime('%Y-%m-%d') }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
