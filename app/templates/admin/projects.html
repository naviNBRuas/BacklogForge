{% extends "base.html" %}
{% block title %}Projects{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin.dashboard') }}">&larr; Admin Dashboard</a></p>
<h1>Projects</h1>
<table>
  <tr><th>Name</th><th>Owner</th><th>Created</th></tr>
  {% for project in projects %}
  <tr><td>{{ project.name }}</td><td>{{ project.owner.email }}</td><td>{{ project.created_at.strftime('%Y-%m-%d') }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
